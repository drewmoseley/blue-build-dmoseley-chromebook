---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
name: blue-build-dmoseley-chromebook
description: Personal OS image for drewmoseley on HP chromebook.
base-image: ghcr.io/drewmoseley/blue-build-dmoseley
image-version: latest

modules:
  # Add configuration files for linux-audio postinstall scriptlet
  # Unfortunately this has to be done at boot time as it probes the hardware
  # and makes config changes.  That also means we have to do a writable
  # overlay for the files it changes.  Hopefully some day this can be
  # folded back into the package.
  - type: files
    files:
      - source: system
        destination: /

  - type: dnf
    repos:
      files:
        - https://github.com/terrapkg/subatomic-repos/raw/main/terra.repo
      copr:
        - pvermeer/chromebook-linux-audio
        - alternateved/keyd
    install:
      packages:
        - python3-libfdt
        - keyd
        - cros-keyboard-map
        - chromebook-linux-audio

  # Enable the service
  - type: systemd
    system:
      enabled:
        - chromebook-audio-setup.service

  # Chromebook-only flatpak trim. The parent recipe's default-flatpaks
  # list is shared by every host; this box is disk-constrained, so drop
  # unused/stale apps here instead of touching the shared base recipe.
  # default-flatpaks (v2) has no "remove" key and the boot-time reconciler
  # only installs from configuration.yaml, so edit the baked file directly.
  # Precise line deletion is safe: flatpak app IDs are unique in the file.
  - type: script
    snippets:
      - |
        CONFIG="/usr/share/bluebuild/default-flatpaks/configuration.yaml"
        for id in \
            cc.arduino.IDE2 \
            com.bambulab.BambuStudio \
            com.ultimaker.cura \
            fr.handbrake.ghb \
            org.blender.Blender \
            org.freecad.FreeCAD \
            org.gimp.GIMP \
            org.gnome.Boxes \
            org.inkscape.Inkscape \
            org.shotcut.Shotcut \
            org.videolan.VLC; do
          sed -i "\|^  - ${id}\$|d" "${CONFIG}"
        done
